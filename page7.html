<!DOCTYPE html>
<html>
<head>
    <title>Images in Tables</title>
</head>
<body>

    <h2>Images in Tables</h2>
    <hr>

    <h3>What are your favorite pets ?</h3>

    <table border="1" cellpadding="15" cellspacing="0">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>

        <tr>
            <td>
                <img src="horse.jpg" alt="Horse" width="300">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Horse" target="_blank">Horse</a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="dogs.jpg" alt="Dogs" width="300">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog" target="_blank">Dogs</a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.jpg" alt="Cat" width="300">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat" target="_blank">Cats</a>
            </td>
        </tr>

    </table>

</body>
</html>
